<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1110" viewBox="0 0 900 1110" role="img" aria-label="An anomaly detector as one pipekit Graph: sources are read in parallel (ThreadMap around Cache around Retry around ReadTile), stacked and checked, composited by a Branch (median for few exposures, mean for many), turned into a z-score against a background input and a channel ratio, scored, thresholded with a Tap, and summarised by a Fanout; composite, score, mask and summary are its outputs">
<title>An anomaly detector as one pipekit Graph: sources are read in parallel (ThreadMap around Cache around Retry around ReadTile), stacked and checked, composited by a Branch (median for few exposures, mean for many), turned into a z-score against a background input and a channel ratio, scored, thresholded with a Tap, and summarised by a Fanout; composite, score, mask and summary are its outputs</title>
<defs><marker id="ga" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/></marker><marker id="gb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2DD4BF"/></marker></defs><rect x="260" y="20" width="140" height="36" rx="18" fill="#1F2937" stroke="#2DD4BF" stroke-width="1.6"/><text x="330" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#E5E7EB" text-anchor="middle">sources</text><rect x="30" y="20" width="150" height="36" rx="18" fill="#1F2937" stroke="#2DD4BF" stroke-width="1.6"/><text x="105" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#E5E7EB" text-anchor="middle">background</text><text x="410" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9CA3AF" text-anchor="start">list[str]</text><text x="30" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9CA3AF" text-anchor="start">(C, H, W)</text><path d="M330 56 L330 92" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ga)"/><rect x="170" y="96" width="320" height="210" rx="14" fill="none" stroke="#2DD4BF" stroke-width="1.4" stroke-dasharray="6 5"/><text x="182" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#5EEAD4" text-anchor="start">ThreadMap</text><text x="478" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF" text-anchor="end">8 workers</text><rect x="186" y="130" width="288" height="166" rx="14" fill="none" stroke="#2DD4BF" stroke-wid