, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF" text-anchor="middle">z = (x̄ − μ_b) / σ_b</text><rect x="360" y="690" width="200" height="56" rx="10" fill="#111827" stroke="#2DD4BF" stroke-width="1.6"/><text x="460" y="714" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#E5E7EB" text-anchor="middle">NormalizedDifference</text><text x="460" y="734" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF" text-anchor="middle">r = (x_a − x_b)/(x_a + x_b)</text><path d="M105 56 L105 718 L146 718" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ga)"/><path d="M250 746 L250 780 L330 780" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M460 746 L460 780 L330 780" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 780 L330 802" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ga)"/><text x="260" y="774" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9CA3AF" text-anchor="start">(C, H, W)</text><text x="470" y="774" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9CA3AF" text-anchor="start">(H, W)</text><rect x="220" y="806" width="220" height="56" rx="10" fill="#111827" stroke="#2DD4BF" stroke-width="1.6"/><text x="330" y="830" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#E5E7EB" text-anchor="middle">Score</text><text x="330" y="850" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF" text-anchor="middle">s = maxᶜ |z| + w · |r − r̄|</text><path d="M444 834 L676 834" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5" marker-end="url(#gb)"/><rect x="680" y="816" width="150" height="36" rx="18" fill="#1F2937" stroke="#2DD4BF" stroke-width="2.6"/><text x="755" y="839" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#E5E7EB" text-anchor="middle">score</text><path d="M330 862 L330 896" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ga)"/><text x="340" y="885" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9CA3AF" text-anchor="start">(H, W)</text><rect x="220" y="900" width="220" height="56" rx="10" fill="#111827" stroke="#2DD4BF" stroke-width="1.6"/><text x="330" y="924" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#E5E7EB" text-anchor="middle">Threshold</text><text x="330" y="944" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF" text-anchor="middle">m = 1[s &gt; k]</text><path d="M216 928 L120 928" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4" marker-end="url(#ga)"/><rect x="30" y="910" width="86" height="36" rx="8" fill="none" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="3 4"/><text x="73" y="933" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#9CA3AF" text-anchor="middle">Tap</text><text x="73" y="964" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9CA3AF" text-anchor="middle">log count</text><path d="M444 928 L676 928" fill="none" stroke=