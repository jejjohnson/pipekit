<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492" role="img" aria-label="A pipekit Operator takes a carrier and returns one through a single _apply method; it composes into a Sequential (a | b | c), a Graph with named inputs and outputs, wrappers such as Retry, Cache and Tap, and stateful steps such as Cycle and TrainingLoop, each itself an Operator">
<title>A pipekit Operator takes a carrier and returns one through a single _apply method; it composes into a Sequential (a | b | c), a Graph with named inputs and outputs, wrappers such as Retry, Cache and Tap, and stateful steps such as Cycle and TrainingLoop, each itself an Operator</title>
<defs><marker id="oa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/></marker><marker id="ob" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/></marker></defs><rect x="20" y="20" width="400" height="430" rx="18" fill="#F8FAFC" stroke="#0D9488" stroke-width="1.8"/><text x="42" y="56" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2937" text-anchor="start">Operator</text><text x="42" y="80" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">one method: carrier in, carrier out</text><rect x="42" y="148" width="92" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.6"/><text x="88" y="174.32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1F2937" text-anchor="middle">carrier</text><rect x="174" y="140" width="92" height="60" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/><text x="220" y="175.04" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle">_apply</text><rect x="306" y="148" width="92" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.6"/><text x="352" y="174.32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1F2937" text-anchor="middle">carrier</text><path d="M136 170 L170 170" fill="none" stroke="#0D9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ob)"/><path d="M268 170 L302 170" fill="none" stroke="#0D9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ob)"/><text x="42" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1F2937" xml:space="preserve"><tspan fill="#0F766E" font-weight="700">class</tspan> Standardize(Operator):</text><text x="42" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1F2937" xml:space="preserve"><tspan fill="#0F766E" font-weight="700">    def</tspan> __init__(self, *, mean, std):</text><text x="42" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1F2937" xml:space="preserve"><tspan fill="#0F766E" font-weight="700"></tspan>         self.mean, self.std = mean, std</text><text x="42" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1F2937" xml:space="preserve"><tspan fill="#0F766E" font-weight="700"></tspan> </text><text x="42" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1F2937" xml:space="preserve"><tspan fill="#0F766E" font-weight="700">    def</tspan> _apply(self, x):</text><text x="42" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1F2937" xml:space="preserve"><tspan fill="#0F766E" font-weight="700">        return</tspan> (x - self.mean) / self.std</text><text x="42" y="404" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">the carrier is yours:</text><text x="42" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start">ndarray · xarray · DataFrame · AnnData · dict …</text><rect x="450" y="20" width="355" height="205" rx="16" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/><text x="468" y="50" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">Sequential</text><text x="468" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">a | b | c</text><rect x="488" y="106" width="72" height="42" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/><text x="524" y="132.04" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle">a</text><path d="M562 127 L594 127" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oa)"/><rect x="598" y="106" width="72" height="42" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/><text x="634" y="132.04" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle">b</text><path d="M672 127 L704 127" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oa)"/><rect x="708" y="106" width="72" height="42" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/><text x="744" y="132.04" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle">c</text><rect x="825" y="20" width="355" height="205" rx="16" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/><text x="843" y="50" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">Graph</text><text x="843" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Graph(inputs=…, outputs=…)</text><path d="M895 127 L961 92" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oa)"/><path d="M895 127 L961 162" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oa)"/><path d="M1025 92 L1079 119" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oa)"/><path d="M1025 162 L1079 135" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oa)"/><circle cx="873" cy="127" r="20" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.6"/><text x="873" y="131" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle">x</text><rect x="963" y="75" width="60" height="34" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/><text x="993" y="96.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle">f</text><rect x="963" y="145" width="60" height="34" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/><text x="993" y="166.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle">g</text><rect x="1083" y="110" width="60" height="34" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/><text x="1113" y="131.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle">h</text><rect x="450" y="245" width="355" height="205" rx="16" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/><text x="468" y="275" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">Wrap</text><text x="468" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Retry(op) · Cache(op) · Tap(fn)</text><rect x="528" y="311" width="200" height="82" rx="14" fill="none" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="6 5"/><text x="540" y="329" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0F766E" text-anchor="start">Retry</text><rect x="588" y="335" width="80" height="40" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/><text x="628" y="360.04" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle">op</text><path d="M468 355 L584 355" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oa)"/><path d="M670 355 L784 355" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oa)"/><path d="M758 355 L758 397" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="764" y="401" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">Tap</text><rect x="825" y="245" width="355" height="205" rx="16" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/><text x="843" y="275" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="start">State</text><text x="843" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">(x, s) → (x, s): Cycle, TrainingLoop</text><rect x="953" y="327" width="100" height="46" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/><text x="1003" y="355.04" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle">step</text><path d="M843 350 L949 350" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oa)"/><path d="M1055 350 L1159 350" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#oa)"/><path d="M1033 375 C1043 409 963 409 973 379" fill="none" stroke="#0D9488" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ob)"/><text x="1003" y="417" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">s</text><text x="893" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle">x</text><text x="1107" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle">x'</text><text x="815" y="480" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">each shape is itself an Operator, so they nest</text>
