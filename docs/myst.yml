# ---------------------------------------------------------------------------
# mystmd builds the prose half of the documentation: guides, tutorials, the
# design pages of pipekit-ops and pipekit-train, and the executed notebooks.
# The API reference is built separately by Zensical + mkdocstrings and mounted
# at `/reference/`. See `docs/README.md`.
#
# `references.api` points at a LOCAL server because mystmd only loads
# intersphinx inventories over http(s) — a filesystem path is rejected and a
# `file://` URL is silently ignored. `scripts/build_docs.py` serves the freshly
# built API `site/` on this exact port, then rewrites the resulting localhost
# URLs to the deployed `/reference/` path. Keep the port in sync with API_PORT
# in that script.
#
# The design pages share file names across the two packages (README.md,
# vision.md, decisions.md). mystmd builds flat URLs from file names and has no
# way to set a slug, so the second page of a name is served at `<name>-1/`;
# the nav shows each page's own title.
# ---------------------------------------------------------------------------
version: 1

project:
  id: pipekit-docs
  title: pipekit
  description: >-
    A carrier-agnostic operator-graph framework for composable scientific
    pipelines, as a uv workspace of seven packages.
  github: https://github.com/jejjohnson/pipekit
  authors:
    - name: J. Emmanuel Johnson
  references:
    api: http://127.0.0.1:8910/
  exclude:
    - README.md
    - templates/**
    - api/**
  toc:
    - file: index.md
    - title: Getting started
      children:
        - file: installation.md
          title: Installation
        - file: getting-started.md
          title: Getting started
        - file: core-tour.md
          title: Tour of the core
    - title: Quickstarts
      children:
        - file: quickstart/quickstart-ops.md
          title: pipekit-ops
        - file: quickstart/quickstart-array.md
          title: pipekit-array
        - file: quickstart/quickstart-cycle.md
          title: pipekit-cycle
        - file: quickstart/quickstart-train.md
          title: pipekit-train
    - title: Concepts
      children:
        - file: concepts.md
          title: Concepts
        - file: protocols.md
          title: Protocols
        - file: patterns.md
          title: Patterns
        - file: guards.md
          title: Guards
        - file: background/toolz.md
          title: "Background: toolz"
    - title: Tutorials
      children:
        - file: tutorials/train-emulator.md
          title: Train an emulator
        - file: tutorials/da-cycle.md
          title: Run a DA cycle
        - file: tutorials/anomaly-graph.md
          title: Build a bigger graph
        - file: tutorials/train-register-forecast.md
          title: Train, register, forecast
        - file: tutorials/inference.md
          title: Run inference
        - file: tutorials/ensemble-da.md
          title: Ensemble data assimilation
        - file: tutorials/etl-regions.md
          title: ETL over many regions
        - file: tutorials/pipekit-under-jit.md
          title: Pipelines under jit
    - title: Notebooks (pipekit-train)
      children:
        - file: notebooks/pipekit_train_quickstart.ipynb
          title: Quickstart (MLP regression)
        - file: notebooks/pipekit_train_cycle_handoff.ipynb
          title: Cycle handoff
        - file: notebooks/pipekit_train_numpyro_svi.ipynb
          title: NumPyro SVI
        - file: notebooks/pipekit_train_numpyro_mcmc.ipynb
          title: NumPyro NUTS
        - file: notebooks/pipekit_train_blackjax.ipynb
          title: BlackJAX NUTS
    - title: Design
      children:
        - title: pipekit-ops
          children:
            - file: design-ops/README.md
              title: Overview
            - file: design-ops/vision.md
              title: Vision
            - file: design-ops/api/README.md
              title: Operator catalogue
            - file: design-ops/api/execution.md
              title: Execution
            - file: design-ops/api/operators.md
              title: Operators
            - file: design-ops/toolz.md
              title: toolz parity
            - file: design-ops/decisions.md
              title: Decisions
            - file: design-ops/roadmap.md
              title: Roadmap and gates
        - title: pipekit-train
          children:
            - file: design-train/README.md
              title: Overview
            - file: design-train/vision.md
              title: Vision
            - file: design-train/architecture.md
              title: Architecture
            - file: design-train/decisions.md
