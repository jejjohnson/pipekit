[project]
name = "pipekit-cycle"
version = "0.1.0"
description = "Time-stepping, data assimilation, and observation operators on top of pipekit."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "../../LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Development Status :: 1 - Planning"]
dependencies = ["pipekit"]

[project.optional-dependencies]
array = ["pipekit-array"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipekit_cycle"]
