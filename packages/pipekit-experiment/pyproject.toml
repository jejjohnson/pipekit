[project]
name = "pipekit-experiment"
version = "0.0.0"
description = "Experiment tracking adapters and content-addressed model registry for pipekit pipelines."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "../../LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Development Status :: 1 - Planning"]
dependencies = ["pipekit"]

[project.optional-dependencies]
mlflow = ["mlflow>=2.10"]
wandb = ["wandb>=0.16"]
dvc = ["dvc>=3.30"]
hydra = ["hydra-core>=1.3", "hydra-zen>=0.13"]
metaflow = ["metaflow>=2.10"]
s3 = ["fsspec>=2024.0", "s3fs>=2024.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipekit_experiment"]
