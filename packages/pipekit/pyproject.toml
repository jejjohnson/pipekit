[project]
name = "pipekit"
version = "0.2.0"
description = "The pipekit workspace in one install: pipekit-ops, -array, -cycle, -experiment, -evaluate, -train and -jax."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["pipeline", "operators", "composition", "scientific-computing"]
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
# The umbrella holds no code: it installs the seven packages, each imported
# under its own name (pipekit_ops, pipekit_array, pipekit_cycle, …).
# Libraries should depend on the package they import, not on this one:
# pipekit-ops alone has no third-party dependencies.
# Lower bounds are each package's first release that imports pipekit_ops:
# an older release still imports `pipekit` and breaks against this umbrella.
dependencies = [
    "pipekit-ops>=0.2.0",
    "pipekit-array>=0.1.0",
    "pipekit-cycle>=0.1.0",
    "pipekit-experiment>=0.1.0",
    "pipekit-evaluate>=0.2.0",
    "pipekit-train>=0.2.0",
    "pipekit-jax>=0.1.0",
]

[project.urls]
Repository = "https://github.com/jejjohnson/pipekit"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipekit"]
