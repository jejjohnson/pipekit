[project]
name = "pipekit-jax"
version = "0.0.5"
description = "JAX / Equinox carrier integration for pipekit — JaxModelOp with weight-blob round-trip through ModelRegistry."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Development Status :: 3 - Alpha"]
dependencies = [
    "pipekit",
    "pipekit-cycle",
    "equinox>=0.11",
    "jax>=0.4.30",
    "jaxtyping>=0.2",
]

[project.optional-dependencies]
diffrax = ["diffrax>=0.7"]
# `to_jax(op)`: a pipekit-array KernelOp as a JaxOperator (the edge pipekit-jax
# already has through pipekit-cycle's [array] extra, declared here).
array = ["pipekit-array"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipekit_jax"]
