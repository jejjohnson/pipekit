[project]
name = "pipekit-evaluate"
version = "0.0.2"
description = "Multidimensional evaluation framework (Unit × Lens × Stage) for pipekit pipelines."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "../../LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Development Status :: 2 - Pre-Alpha"]
dependencies = [
    "pipekit",
    "numpy>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
# The benchmark Task reuses pipekit-cycle's ForwardModel / ObservationOperator
# (referenced under TYPE_CHECKING only); install this extra to type-check or
# build tasks against the concrete protocol types.
cycle = ["pipekit-cycle"]
xskill = ["xskillscore>=0.0.26"]
proper = ["properscoring>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipekit_evaluate"]
