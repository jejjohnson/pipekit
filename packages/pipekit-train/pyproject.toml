[project]
name = "pipekit-train"
version = "0.0.1"
description = "Training pipelines for emulators and amortized inference — thin orchestration over Lightning, Equinox+Optax, and Keras 3."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "../../LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Development Status :: 1 - Planning"]
dependencies = ["pipekit"]

[project.optional-dependencies]
# Backend training tools — pick one per training run.
equinox   = [
    "equinox>=0.11",
    "optax>=0.2",
    "jax>=0.4.30",
    "grain>=0.2",
    "orbax-checkpoint>=0.6",
    "jaxtyping>=0.2",
]
lightning = ["lightning>=2.4", "torch>=2.0"]
keras     = ["keras>=3.0"]

# Bayesian-inference backends (numpyro-svi / numpyro-mcmc). One extra, two
# adapters (per ADR D13). JAX arrives via numpyro.
numpyro   = ["numpyro>=0.15", "optax>=0.2"]

# Workspace-internal data sources / reproducibility integration.
# `catalog` extra (geocatalog) lands once geocatalog publishes to PyPI;
# see docs/design/api/datasets.md.
cycle     = ["pipekit-cycle"]
experiment = ["pipekit-experiment"]

# Disk-cache storage. All cache backends need `zarr` (lazy-imported
# on first hit). The cloud-cache extras also pull in `fsspec` + the
# relevant protocol driver.
cache     = ["zarr>=2.18"]
s3        = ["zarr>=2.18", "fsspec>=2024.0", "s3fs>=2024.0"]
gcs       = ["zarr>=2.18", "fsspec>=2024.0", "gcsfs>=2024.0"]

# Lazy, indexable windowed-Zarr datasets (`XarrayWindowDataset`). The
# block-reader / shuffle path rides Grain (already pulled by `[equinox]`).
# NOTE: `geopatcher` supplies the temporal stencils but is not on PyPI and
# is not a pipekit workspace member, so it is NOT pinned here — it is a
# lazy import raising an actionable ImportError, and must be installed
# alongside (e.g. `uv pip install -e ../geopatcher`). See
# docs/design/api/datasets.md.
xreader   = ["xarray>=2024.0", "zarr>=2.18", "grain>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipekit_train"]
