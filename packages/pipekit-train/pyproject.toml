[project]
name = "pipekit-train"
version = "0.0.1"
description = "Training pipelines for emulators and amortized inference — thin orchestration over Lightning, Equinox+Optax, and Keras 3."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "../../LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Development Status :: 1 - Planning"]
dependencies = ["pipekit"]

[project.optional-dependencies]
# Backend training tools — pick one per training run.
equinox   = [
    "equinox>=0.11",
    "optax>=0.2",
    "jax>=0.4.30",
    "grain>=0.2",
    "orbax-checkpoint>=0.6",
    "jaxtyping>=0.2",
]
lightning = ["lightning>=2.4", "torch>=2.0"]
keras     = ["keras>=3.0"]

# Workspace-internal data sources / reproducibility integration.
# `catalog` extra (geocatalog) lands once geocatalog publishes to PyPI;
# see docs/design/api/datasets.md.
cycle     = ["pipekit-cycle"]
experiment = ["pipekit-experiment"]

# Disk-cache storage. Local-filesystem CachedDataset has no extra
# requirements beyond `zarr` (lazy-imported on first cache hit).
# fsspec URIs (s3://, gcs://, …) need `fsspec` + the relevant
# protocol driver; pick the one that matches your storage.
s3        = ["fsspec>=2024.0", "s3fs>=2024.0"]
gcs       = ["fsspec>=2024.0", "gcsfs>=2024.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipekit_train"]
