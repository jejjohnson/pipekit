[project]
name = "pipekit-array"
version = "0.0.7"
description = "Array API operators on top of pipekit — multi-backend (numpy, JAX, CuPy, PyTorch)."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Development Status :: 1 - Planning"]
dependencies = ["pipekit>=0.1.4"]

[project.optional-dependencies]
numpy = ["numpy>=2.0"]
jax = ["jax>=0.4.20"]
torch = ["torch>=2.0"]
cupy = ["cupy>=13"]
dask = ["dask[array]>=2024"]
# `DimArray.to_xarray`, and the `xr.DataArray` adapter (KernelOp and the
# dim-level functions on DataArrays, lazily through dask).
xarray = ["xarray>=2024.6"]
# The scikit-learn wrapper, Estimator (geostack OP-O3).
sklearn = ["scikit-learn>=1.4"]
# The named-dims einx bridge, pipekit_array.einx (geostack OP-O2).
einx = ["einx>=0.4"]
compat = [
    "array-api-compat>=1.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipekit_array"]
