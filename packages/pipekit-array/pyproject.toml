[project]
name = "pipekit-array"
version = "0.0.1"
description = "Array API operators on top of pipekit — multi-backend (numpy, JAX, CuPy, PyTorch)."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "../../LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Development Status :: 1 - Planning"]
dependencies = ["pipekit"]

[project.optional-dependencies]
numpy = ["numpy>=2.0"]
jax = ["jax>=0.4.20"]
torch = ["torch>=2.0"]
cupy = ["cupy>=13"]
dask = ["dask[array]>=2024"]
compat = [
    "array-api-compat>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipekit_array"]
