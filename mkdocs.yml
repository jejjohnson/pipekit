# ---------------------------------------------------------------------------
# Zensical builds ONLY the API reference from this file (it reads mkdocs.yml
# as is), and it is deployed as the `/reference/` subtree of the MyST site.
# Guides, tutorials, design pages and notebooks are built by mystmd from
# `docs/myst.yml`. See `docs/README.md` for the split and the rationale.
#
# mkdocstrings publishes a Sphinx-compatible `objects.inv` into `site/`, and
# that inventory is what lets the MyST prose cross-reference into these pages.
# ---------------------------------------------------------------------------
site_name: pipekit API reference
site_description: API reference for the pipekit workspace (pipekit-ops, pipekit-array, pipekit-cycle, pipekit-experiment, pipekit-evaluate, pipekit-train and pipekit-jax), generated from Google-style docstrings.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/pipekit
repo_name: jejjohnson/pipekit

docs_dir: docs/api
site_dir: site

# The guide pages live in the MyST half of the site, so links to them point
# outside `docs_dir` by design. The assembled-site link checker in
# `scripts/build_docs.py` validates them instead, across both halves, which
# neither tool can do on its own.
validation:
  links:
    unrecognized_links: ignore
    absolute_links: ignore

theme:
  name: material
  # Zensical's Material-compatible look; `modern` is its newer default.
  variant: classic
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/pipekit-ops/src
            - packages/pipekit-array/src
            - packages/pipekit-cycle/src
            - packages/pipekit-experiment/src
            - packages/pipekit-evaluate/src
            - packages/pipekit-train/src
            - packages/pipekit-jax/src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Overview: index.md
  - pipekit-ops: pipekit-ops.md
  - pipekit-array: pipekit-array.md
  - pipekit-cycle: pipekit-cycle.md
  - pipekit-experiment: pipekit-experiment.md
  - pipekit-evaluate: pipekit-evaluate.md
  - pipekit-train: pipekit-train.md
  - pipekit-jax: pipekit-jax.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
