site_name: pipekit
site_description: A carrier-agnostic operator-graph framework for composable scientific pipelines.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/pipekit
repo_name: jejjohnson/pipekit

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/pipekit/src
            - packages/pipekit-array/src
            - packages/pipekit-cycle/src
            - packages/pipekit-experiment/src
            - packages/pipekit-evaluate/src
            - packages/pipekit-train/src
            - packages/pipekit-jax/src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - Installation: installation.md
  - Tutorials:
      - Train an emulator: tutorials/train-emulator.md
      - Run a DA cycle: tutorials/da-cycle.md
  - API Reference:
      - pipekit: api/pipekit.md
      - pipekit-array: api/pipekit-array.md
      - pipekit-cycle: api/pipekit-cycle.md
      - pipekit-experiment: api/pipekit-experiment.md
      - pipekit-train: api/pipekit-train.md
      - pipekit-jax: api/pipekit-jax.md
  - Notebooks:
      - Quickstart (MLP regression): notebooks/pipekit_train_quickstart.ipynb
      - Cycle handoff (emulator → forecast): notebooks/pipekit_train_cycle_handoff.ipynb
  - Design:
      - pipekit-train:
          - Overview: design-train/README.md
          - Vision: design-train/vision.md
          - Architecture: design-train/architecture.md
          - Decisions (ADRs): design-train/decisions.md
          - Boundaries & future work: design-train/boundaries.md
          - Backend adapters: design-train/api/adapters.md
          - NumPyro adapters (SVI + MCMC): design-train/numpyro_adapter.md
          - BlackJAX adapter (NUTS / SG-MCMC): design-train/blackjax_adapter.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
