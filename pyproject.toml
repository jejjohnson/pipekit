[project]
name = "pipekit-monorepo"
version = "0.0.0"
description = "Pipekit monorepo workspace root (not published — see packages/* for shipped libraries)."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pipekit = { workspace = true }
pipekit-ops = { workspace = true }
pipekit-array = { workspace = true }
pipekit-cycle = { workspace = true }
pipekit-experiment = { workspace = true }
pipekit-evaluate = { workspace = true }
pipekit-train = { workspace = true }
pipekit-jax = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Workspace root ships no code; the per-package wheels live under packages/*.
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.5.1",
    # xarray backs the pipekit-array [xarray] extra; dask keeps its tests lazy.
    "xarray>=2024.6",
    "dask[array]>=2024",
    # scikit-learn backs the pipekit-array [sklearn] extra (Estimator).
    "scikit-learn>=1.4",
    # einx backs the pipekit-array [einx] extra (pipekit_array.bridges.einx).
    "einx>=0.4",
    # array-api-compat backs the pipekit-array [compat] extra
    # (pipekit_array.arrays); array-api-strict is its test-only reference.
    "array-api-compat>=1.11",
    "array-api-strict>=2.3",
    # fsspec backs the pipekit-experiment [s3] extra; dev-installed so the
    # S3ModelRegistry tests run (on the in-memory filesystem) in CI.
    "fsspec>=2024.0",
    # Test-only references for the pipekit-ops P1 gates (G1-1): property tests
    # with hypothesis, compared against toolz. pipekit-ops never imports them.
    "hypothesis>=6.100",
    "toolz>=1.0",
    # Workspace members are dev-installed so tests can import them.
    "pipekit",
    "pipekit-ops",
    "pipekit-array",
    "pipekit-cycle",
    "pipekit-experiment",
    "pipekit-evaluate",
    "pipekit-train",
    "pipekit-jax",
]
# The pipekit-train extras that have test modules behind them. Only the test job
# installs these: the typecheck job syncs the default `dev` group, and ty reports
# new diagnostics once it can see these libraries.
train-extras = [
    "pipekit-train[equinox,numpyro,blackjax,cache]",
]
lint = [
    "ruff>=0.15.11",
]
typecheck = [
    "ty>=0.0.31",
]
docs = [
    # The prose half of the site (guides, tutorials, design pages and the
    # executed notebooks) is built by mystmd, a Node CLI installed with
    # `npm install -g mystmd` rather than through uv. Zensical (the successor to
    # Material for MkDocs, which reached end of life on 2026-11-05) builds only
    # the API reference from mkdocs.yml; its `objects.inv` is what lets the MyST
    # prose cross-reference into it. See docs/README.md.
    "zensical>=0.0.74",
    "mkdocstrings[python]>=1.0.8",
    # scripts/build_docs.py, which builds both halves and checks their links.
    "cyclopts>=4",
    "loguru>=0.7",
    "jupytext>=1.19.1",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "watermark>=2.4",
    "pygments>=2.19,<2.22",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E721", "E731", "E741"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["packages/pipekit/tests", "packages/pipekit-ops/tests", "packages/pipekit-array/tests", "packages/pipekit-cycle/tests", "packages/pipekit-experiment/tests", "packages/pipekit-evaluate/tests", "packages/pipekit-train/tests", "packages/pipekit-jax/tests"]
# Deselect slow / integration tests by default so the CI run is the fast
# subset. Run the heavy ones explicitly: `pytest -m slow` / `-m integration`
# (or override entirely with `-o addopts=`).
addopts = "-q -m 'not slow and not integration'"
markers = [
    "slow: long-running test (e.g. MCMC/SVI convergence); deselected by default.",
    "integration: end-to-end across a backend's real stack; deselected by default.",
]

[tool.coverage.run]
source = [
    "packages/pipekit-ops/src",
    "packages/pipekit-array/src",
    "packages/pipekit-cycle/src",
    "packages/pipekit-experiment/src",
    "packages/pipekit-evaluate/src",
    "packages/pipekit-train/src",
    "packages/pipekit-jax/src",
]
omit = ["**/tests/*"]

[tool.coverage.report]
show_missing = true
