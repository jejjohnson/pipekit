[project]
name = "pipekit-monorepo"
version = "0.0.0"
description = "Pipekit monorepo workspace root (not published — see packages/* for shipped libraries)."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pipekit = { workspace = true }
pipekit-array = { workspace = true }
pipekit-cycle = { workspace = true }
pipekit-experiment = { workspace = true }
pipekit-evaluate = { workspace = true }
pipekit-train = { workspace = true }
pipekit-jax = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Workspace root ships no code; the per-package wheels live under packages/*.
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.5.1",
    # diffrax backs the pipekit-jax [diffrax] extra; dev-installed so the
    # adapter tests run in the workspace.
    "diffrax>=0.7",
    # Workspace members are dev-installed so tests can import them.
    "pipekit",
    "pipekit-array",
    "pipekit-cycle",
    "pipekit-experiment",
    "pipekit-evaluate",
    "pipekit-train",
    "pipekit-jax",
]
lint = [
    "ruff>=0.15.11",
]
typecheck = [
    "ty>=0.0.31",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-jupyter>=0.26.3",
    "jupytext>=1.19.1",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "watermark>=2.4",
    "pygments>=2.19,<2.22",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E721", "E731", "E741"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["packages/pipekit/tests", "packages/pipekit-array/tests", "packages/pipekit-cycle/tests", "packages/pipekit-experiment/tests", "packages/pipekit-evaluate/tests", "packages/pipekit-train/tests", "packages/pipekit-jax/tests"]
# Deselect slow / integration tests by default so the CI run is the fast
# subset. Run the heavy ones explicitly: `pytest -m slow` / `-m integration`
# (or override entirely with `-o addopts=`).
addopts = "-q -m 'not slow and not integration'"
markers = [
    "slow: long-running test (e.g. MCMC/SVI convergence); deselected by default.",
    "integration: end-to-end across a backend's real stack; deselected by default.",
]

[tool.coverage.run]
source = [
    "packages/pipekit/src",
    "packages/pipekit-array/src",
    "packages/pipekit-cycle/src",
    "packages/pipekit-experiment/src",
    "packages/pipekit-evaluate/src",
    "packages/pipekit-train/src",
    "packages/pipekit-jax/src",
]
omit = ["**/tests/*"]

[tool.coverage.report]
show_missing = true
