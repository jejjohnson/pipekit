# PR auto-labeling rules.
#
# Applied by .github/workflows/label-pr.yml using actions/labeler.
# Labels referenced here must exist — run `make gh-labels` to create them.
# The `dependencies` label is also created by the bootstrap script so this
# file works on a fresh repo with no manual label setup.
#
# Scopes below map file paths to the standard taxonomy:
#   area:*   — which part of the project the change touches
#   layer:*  — which implementation layer (heuristic; pipekit isn't strictly layered)
#   type:*   — left to issue templates (NOT auto-applied on PRs)

"area:engineering":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/**"
      - "pyproject.toml"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "uv.lock"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - "packages/*/pyproject.toml"

"area:docs":
  - changed-files:
    - any-glob-to-any-file:
      - "docs/**"
      - "mkdocs.yml"
      - "notebooks/**"
      - "*.md"
      - "packages/*/README.md"

"area:testing":
  - changed-files:
    - any-glob-to-any-file: "packages/*/tests/**"

# Catch-all for source changes that don't match a specific package.
"area:code":
  - changed-files:
    - any-glob-to-any-file: "packages/*/src/**"

# --- Layer scopes ---------------------------------------------------------
# pipekit's natural "layers" are the package boundaries themselves —
# `layer:0-primitives` = the carrier-agnostic core; everything else builds
# on top. The layer:* labels are retained from the template taxonomy with
# pipekit-specific path mappings.

"layer:0-primitives":
  - changed-files:
    - any-glob-to-any-file: "packages/pipekit/src/**"

"layer:1-components":
  - changed-files:
    - any-glob-to-any-file:
      - "packages/pipekit-array/src/**"
      - "packages/pipekit-cycle/src/**"
      - "packages/pipekit-experiment/src/**"
      - "packages/pipekit-evaluate/src/**"

# --- Default / legacy labels retained for Dependabot compatibility ---------

"dependencies":
  - changed-files:
    - any-glob-to-any-file:
      - "pyproject.toml"
      - "packages/*/pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"
